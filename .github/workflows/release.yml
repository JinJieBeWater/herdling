name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$GITHUB_REF_TYPE" == tag && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG must match Info.plist version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test app packaging failure handling
        run: bash scripts/test-build-app.sh
      - name: Test
        run: swift test --no-parallel
      - name: Build app
        run: bash scripts/build-app.sh release
      - name: Verify packaging
        run: bash scripts/verify-app-packaging.sh --app .build/Herdling.app
      - name: Archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(lipo -archs .build/Herdling.app/Contents/MacOS/Herdling)" = "$ARCH"
          mkdir -p dist
          archive="Herdling-$VERSION-macOS-$ARCH.zip"
          ditto -c -k --sequesterRsrc --keepParent .build/Herdling.app "dist/$archive"
          cd dist
          shasum -a 256 "$archive" > "$archive.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Herdling-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Herdling-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "Herdling $RELEASE_TAG" --generate-notes \
            --notes 'Requires macOS 15 or later. Choose arm64 for Apple Silicon or x86_64 for Intel. Extract Herdling.app and move it to /Applications. These builds are ad-hoc signed, without an Apple Developer ID certificate or notarization. macOS may block the first launch; after attempting to open the app, use System Settings → Privacy & Security → Open Anyway only if you trust this release. A separate SHA-256 checksum file is provided for each ZIP.'
