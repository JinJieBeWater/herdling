name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test app packaging failure handling
        run: bash scripts/test-build-app.sh
      - name: Test
        run: swift test --no-parallel
      - name: Build Universal2 app
        run: bash scripts/build-app.sh release
      - name: Verify packaging
        run: bash scripts/verify-app-packaging.sh --app .build/Herdling.app
      - name: Test release signing and failure handling
        run: |
          tools=$(bash scripts/fetch-sparkle-tools.sh)
          bash scripts/test-release.sh "$tools"
      - name: Archive app for release job
        run: ditto -c -k --sequesterRsrc --keepParent .build/Herdling.app .build/Herdling.app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Herdling-universal
          path: .build/Herdling.app.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    concurrency:
      group: herdling-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Herdling-universal
          path: .build
      - name: Restore app and generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ditto -xk .build/Herdling.app.zip .build
          previous=$(gh release view --json tagName --jq .tagName)
          echo "PREVIOUS_RELEASE_TAG=$previous" >> "$GITHUB_ENV"
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body > .build/release-notes.md
          cat >> .build/release-notes.md <<'NOTES'

          Requires macOS 15 or later. The Universal2 ZIP supports Apple Silicon and Intel.
          Extract Herdling.app and move it to /Applications. These builds are ad-hoc signed,
          without Apple Developer ID or notarization. Trust the source before using
          System Settings → Privacy & Security → Open Anyway for the first launch.
          Subsequent updates use Sparkle with signed feeds and EdDSA-signed archives.
          NOTES
      - name: Sign archive and appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          tools=$(bash scripts/fetch-sparkle-tools.sh)
          echo "SPARKLE_BIN=$tools" >> "$GITHUB_ENV"
          bash scripts/prepare-release.sh "$tools"
      - name: Upload draft and publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" .build/release/* --draft --verify-tag \
            --title "Herdling $RELEASE_TAG" --notes-file .build/release-notes.md
          gh release view "$RELEASE_TAG" --json assets,isDraft > .build/draft-release.json
          python3 - <<'PY'
          import json, pathlib
          release = json.load(open('.build/draft-release.json'))
          expected = {p.name: p.stat().st_size for p in pathlib.Path('.build/release').iterdir()}
          assert release['isDraft'] and {a['name']: a['size'] for a in release['assets']} == expected, 'Draft assets are incomplete'
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Verify public feed delivery
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/appcast.xml" \
            --output .build/published-appcast.xml
          cmp .build/release/appcast.xml .build/published-appcast.xml
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SPARKLE_BIN/sign_update" \
            --ed-key-file - --verify .build/published-appcast.xml
